spring.application.name=store-service

# Settings come from environment variables, with a .env file in the working directory as the
# fallback; the variable names are read by AppConfig. APP_ENV doubles as the Spring profile.
spring.config.import=optional:file:.env[.properties]
spring.profiles.active=${APP_ENV:development}
spring.main.banner-mode=off

# One virtual thread per request, like a goroutine per request in the Go service.
spring.threads.virtual.enabled=true

# Requests are decoded by the controllers themselves, whatever their Content-Type, and every
# unknown route gets the API's JSON 404 instead of a static resource lookup.
spring.mvc.formcontent.filter.enabled=false
spring.web.resources.add-mappings=false
# Unknown routes are already in the access log, as in the Go service.
logging.level.org.springframework.web.servlet.PageNotFound=error
spring.servlet.multipart.resolve-lazily=true

# Accept the URL characters Go's server accepts.
server.tomcat.relaxed-path-chars=|,{,},[,],^,`,\\,<,>,"
server.tomcat.relaxed-query-chars=|,{,},[,],^,`,\\,<,>,"

spring.flyway.locations=classpath:db/migration

# Redis is used through templates only, never as a Spring Data repository store.
spring.data.redis.repositories.enabled=false
