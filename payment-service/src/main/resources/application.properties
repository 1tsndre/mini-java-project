spring.application.name=payment-service

# Settings come from environment variables, with a .env file in the working directory as the
# fallback. APP_ENV doubles as the Spring profile; this service defaults to production.
spring.config.import=optional:file:.env[.properties]
spring.profiles.active=${APP_ENV:production}
spring.main.banner-mode=off

# No HTTP server: the service talks gRPC and NSQ only, and stays up until it is stopped.
spring.main.web-application-type=none
spring.main.keep-alive=true
spring.threads.virtual.enabled=true
